apiVersion: v1
kind: PersistentVolume
metadata:
  name: ebs-static-pv
spec:
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ebs-sc
  csi:
    driver: ebs.csi.aws.com
    fsType: ext4
    volumeHandle: vol-08c5bfba2535dabed
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ebs-static-pv
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: "ebs-sc"  # Must match the PV storageClassName
  volumeName: ebs-static-pv # Must match the exact name of the PV
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: ebs-static-pv
spec:
  containers:
  - name: nginx
    image: nginx
    volumeMounts:
    - name: persistent-storage
      mountPath: /usr/share/nginx/html
  volumes:
  - name: persistent-storage
    persistentVolumeClaim:
      claimName: ebs-static-pv
  nodeSelector:
    topology.kubernetes.io/zone: us-east-1d